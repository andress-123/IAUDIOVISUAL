<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playground · forma y color en cuadros</title>
<meta name="description" content="Playground: ejercicio de exploración de la expansión de la forma y el color como elemento de diseño. Convierte una foto en cuadros, en tu navegador, y descárgala en SVG o PNG.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --ink:#111318; --mute:#667085; --line:#e7e9ee; --soft:#f4f5f8;
    --azul:#0081f3; --r:14px;
    --font:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-height:100dvh;overflow-x:hidden}
  button,select,input{font:inherit;color:inherit}
  [hidden]{display:none!important}

  /* barra superior */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,3vw,32px)}
  .logo{display:flex;align-items:center;gap:12px;font-weight:300;letter-spacing:.14em;font-size:14px;text-transform:uppercase}
  .logo i{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
  .logo i b{width:6px;height:6px;display:block}
  .acciones{display:flex;gap:8px;align-items:center}

  .btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 18px;min-height:44px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--soft)}
  .btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.pri:hover{background:#2a2e38}
  .btn.txt{border-color:transparent;color:var(--mute)}
  .btn.txt:hover{color:var(--ink);background:transparent}
  :is(.btn,.seg button,.sw,.ico,select,input):focus-visible{outline:2px solid var(--azul);outline-offset:2px}

  /* escenario */
  .stage{min-width:0;position:relative;display:grid;place-items:center;padding:0 clamp(16px,4vw,48px) 120px;min-height:0;transition:background .2s}
  .stage.drag{background:var(--soft)}
  .vacio{text-align:center;max-width:520px;display:grid;gap:22px;justify-items:center}
  .vacio h1{margin:0;font-weight:300;font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.01em}
  .vacio p{margin:0;color:var(--mute);max-width:42ch}
  .vacio .fila{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .vacio small{color:var(--mute);font-size:13px}
  .res{width:100%;height:calc(100dvh - 230px);object-fit:contain;display:block;opacity:0;transition:opacity .25s}
  .res.ok{opacity:1}
  .stage.carga .res{opacity:.35}
  .meta{position:absolute;left:clamp(16px,3vw,32px);bottom:112px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
  .aviso{position:absolute;top:0;left:50%;transform:translateX(-50%);max-width:min(92%,460px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;text-align:center}

  /* dock de controles */
  .dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 8px 30px rgba(17,19,24,.08);max-width:calc(100vw - 24px)}
  .sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
  .seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
  .seg button{appearance:none;border:0;background:transparent;border-radius:999px;padding:0 16px;min-height:38px;cursor:pointer;color:var(--mute);font-weight:500;white-space:nowrap}
  .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,19,24,.12)}
  .sws{display:flex;gap:4px;padding:0 2px}
  .sw{width:44px;height:44px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
  .sw span{width:24px;height:24px;border-radius:50%;display:block;transition:transform .15s,box-shadow .15s}
  .sw:hover span{transform:scale(1.1)}
  .sw[aria-pressed=true] span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
  .ico{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .ico:hover{background:var(--soft)}
  .ico[aria-expanded=true]{background:var(--soft)}
  .ico svg{width:20px;height:20px}
  .combo{border:0;background:transparent;min-height:44px;padding:0 8px;font-weight:500;max-width:220px;cursor:pointer}

  /* ajustes (divulgación progresiva) */
  .ajustes{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);width:min(340px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px rgba(17,19,24,.12);padding:18px;display:grid;gap:16px}
  .campo{display:grid;gap:4px}
  .campo label,.campo .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
  .campo output{color:var(--ink);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--ink);height:28px;margin:0}
  .sw-line{display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .sw-line input{width:20px;height:20px;accent-color:var(--ink)}

  .pie{position:fixed;right:clamp(16px,3vw,32px);top:26px;display:none}

  @media (max-width:720px){
    .top{padding:14px 16px}
    .dock{flex-wrap:wrap;justify-content:center;border-radius:22px;width:calc(100vw - 24px)}
    .sep{display:none}
    .meta{display:none}
    .btn .t{display:none}
    .btn{padding:0 14px}
    .res{height:calc(100dvh - 300px)}
    .stage{padding-bottom:170px}
    .ajustes{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 130px)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo" aria-label="Playground"><i id="logo" aria-hidden="true"></i>Playground</div>
  <div class="acciones" id="acciones" hidden>
    <button class="btn txt" id="nueva" type="button" aria-label="Nueva foto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="t">Nueva foto</span></button>
    <button class="btn" id="d-png" type="button">PNG</button>
    <button class="btn pri" id="d-svg" type="button"><span class="t">Descargar&nbsp;</span>SVG</button>
  </div>
</header>

<main class="stage" id="stage">
  <section class="vacio" id="vacio">
    <h1>Suelta una foto</h1>
    <p>Ejercicio de exploración de la expansión de la forma y el color como elemento de diseño.</p>
    <div class="fila">
      <button class="btn pri" id="subir" type="button">Elegir archivo</button>
      <button class="btn txt" id="ejemplo" type="button">Ver un ejemplo</button>
    </div>
    <small>Se procesa en tu navegador. Tu foto no se sube a ningún sitio.</small>
  </section>
  <img class="res" id="res" alt="Resultado en cuadros" hidden>
  <div class="meta" id="meta" aria-live="polite"></div>
  <div class="aviso" id="aviso" role="status" hidden></div>
  <input id="fichero" type="file" accept="image/*" hidden>
</main>

<div class="ajustes" id="ajustes" hidden role="dialog" aria-label="Ajustes">
  <div class="campo" id="c-relleno"><label for="relleno">Relleno <output id="v-relleno"></output></label><input type="range" id="relleno" min="10" max="85" value="55"></div>
  <div class="campo"><label for="celda">Tamaño del cuadro <output id="v-celda"></output></label><input type="range" id="celda" min="3" max="10" value="5"></div>
  <div class="campo"><label for="dispersion">Cuadros sueltos <output id="v-dispersion"></output></label><input type="range" id="dispersion" min="0" max="200" value="100"></div>
  <div class="campo"><label for="fondo">Detección de fondo <output id="v-fondo"></output></label><input type="range" id="fondo" min="2" max="12" value="5"></div>
  <label class="sw-line" id="c-degradado"><span>Degradado por tono</span><input type="checkbox" id="degradado" checked></label>
</div>

<nav class="dock" id="dock" aria-label="Controles" hidden>
  <div class="seg" role="group" aria-label="Estilo">
    <button type="button" id="m-nube" aria-pressed="true">Nube</button>
    <button type="button" id="m-pixel" aria-pressed="false">Píxel</button>
  </div>
  <span class="sep"></span>
  <div class="sws" id="sws" role="group" aria-label="Color"></div>
  <select class="combo" id="esquema" aria-label="Combinación de colores" hidden></select>
  <span class="sep"></span>
  <button class="ico" id="otra" type="button" aria-label="Otra variación" title="Otra variación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
  </button>
  <button class="ico" id="aj" type="button" aria-label="Ajustes" aria-expanded="false" aria-controls="ajustes" title="Ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</nav>

<script src="generador.js"></script>
<script src="app.js"></script>
</body>
</html>
