/* ============ Primitivas ============ */
const HARD = 'shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]';
const HARD_L = 'shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]';

function Btn({ children, href = '#comprar', onClick, className = '', big }) {
  const cls = `btn-hard inline-flex items-center justify-center gap-3 border-4 border-ink bg-cam text-ink font-display uppercase tracking-wide shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] ${big ? 'px-8 py-5 text-2xl sm:text-4xl' : 'px-5 py-3 text-lg'} ${className}`;
  return onClick
    ? <button onClick={onClick} className={cls}>{children}</button>
    : <a href={href} className={cls}>{children}</a>;
}

function Sticker({ children, className = '' }) {
  return <div className={`border-4 border-ink font-display uppercase leading-none ${HARD} ${className}`}>{children}</div>;
}

function Tape({ className = '' }) {
  return <span aria-hidden="true" className={`absolute h-7 w-24 bg-sun/80 border-2 border-ink/20 ${className}`} />;
}

function Placeholder({ label, bg = 'bg-sky', className = '' }) {
  return (
    <div className={`${bg} stripes relative grid place-items-center border-4 border-ink p-4 text-center ${className}`} role="img" aria-label={label}>
      <span className="bg-paper border-2 border-ink px-3 py-1 text-xs sm:text-sm font-bold uppercase tracking-wider">{label}</span>
    </div>
  );
}

function Polaroid({ children, caption, className = '', rotate = '' }) {
  return (
    <figure className={`bg-white border-4 border-ink p-3 pb-2 ${HARD_L} transition-transform duration-300 hover:rotate-0 hover:z-30 ${rotate} ${className}`}>
      {children}
      {caption && <figcaption className="mt-2 text-center text-xs font-bold uppercase tracking-widest">{caption}</figcaption>}
    </figure>
  );
}

function Marquee({ text, className = '', dur = 28, sep = '✦' }) {
  const unit = Array.from({ length: 8 }, (_, i) => (
    <span key={i} className="flex items-center gap-6 px-3">{text}<span aria-hidden="true">{sep}</span></span>
  ));
  return (
    <div className={`marquee overflow-hidden ${className}`} aria-hidden="true">
      <div className="marquee-track" style={{ '--dur': dur + 's' }}>
        <div className="flex shrink-0">{unit}</div>
        <div className="flex shrink-0">{unit}</div>
      </div>
    </div>
  );
}

function StickyBar() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const buy = document.getElementById('comprar');
    let past = false, onBuy = false;
    const upd = () => setShow(past && !onBuy);
    const sc = () => { past = window.scrollY > 600; upd(); };
    const io = new IntersectionObserver(([e]) => { onBuy = e.isIntersecting; upd(); }, { threshold: 0.1 });
    if (buy) io.observe(buy);
    window.addEventListener('scroll', sc, { passive: true }); sc();
    return () => { window.removeEventListener('scroll', sc); io.disconnect(); };
  }, []);
  return (
    <div aria-hidden={!show}
      className={`fixed inset-x-3 bottom-3 z-50 flex items-center justify-between gap-3 border-4 border-ink bg-sun p-2 pl-4 ${HARD} transition-transform duration-300 md:hidden`}
      style={{ transform: show ? 'none' : 'translateY(160%)', bottom: 'calc(12px + env(safe-area-inset-bottom, 0px))' }}>
      <span className="font-display text-xl leading-none">X9 · {money(CONFIG.price)}</span>
      <Btn className="!px-4 !py-2 !text-base">Comprar</Btn>
    </div>
  );
}
