<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const IMG = window.IMG;

/* ============ CONFIG: edita aquí ============ */
const CONFIG = {
  price: 39.90, oldPrice: 49.90, currency: '€',
  checkoutUrl: '',   // enlace de pago real (Shopify, Stripe, WhatsApp…). Vacío = aviso de ejemplo.
};
const money = n => n.toFixed(2).replace('.', ',') + ' ' + CONFIG.currency;

/* ============ Primitivas ============ */
function Photo({ src, alt, className = '', caption, pos = 'center', children }) {
  return (
    <figure className={`photo grain relative overflow-hidden bg-ink ${className}`}>
      <img src={src} alt={alt} className="h-full w-full object-cover" style={{ objectPosition: pos }} />
      {caption && <figcaption className="label absolute bottom-3 left-3 z-10 text-white/90 mix-blend-difference">{caption}</figcaption>}
      {children}
    </figure>
  );
}

function Button({ children, href = '#comprar', onClick, dark, className = '' }) {
  const base = `btn inline-flex min-h-[52px] items-center justify-center gap-3 px-7 text-[15px] font-semibold tracking-wide ${dark ? 'bg-ink text-bone hover:bg-clay' : 'bg-clay text-ink hover:bg-ink hover:text-bone'} ${className}`;
  return onClick ? <button onClick={onClick} className={base}>{children}</button> : <a href={href} className={base}>{children}</a>;
}

/* ============ Cabecera ============ */
function Announce() {
  return <div className="label bg-ink px-4 py-2.5 text-center text-bone">Envío gratis desde 40 € · 30 días para probarla · 12 meses de garantía</div>;
}

function Nav() {

/* ============ Compra ============ */

  black: { name: 'Negro Carbón', bg: 'bg-clay', swatch: 'bg-ink', img: 'black' },
};
function Buy({ onNote, note }) {
  const [color, setColor] = useState('orange');
  const [view, setView] = useState('front');
  const [qty, setQty] = useState(1);
  const c = COLORS[color];
  const total = qty === 2 ? CONFIG.price * 2 * 0.9 : CONFIG.price;
  const shown = view === 'front' ? IMG[c.img] : view === 'back' ? IMG.back : IMG.sides;
  const alts = { front: `X9 ${c.name}, vista frontal`, back: 'X9, trasera con mini OLED y contador', sides: 'X9, vistas superior, frontal e inferior' };
  const buy = () => CONFIG.checkoutUrl ? window.open(CONFIG.checkoutUrl, '_blank')
    : onNote(`Ejemplo: ${qty}× X9 ${c.name} · ${money(total)}. Añade tu enlace de pago en CONFIG.checkoutUrl.`);
  return (
    <section id="comprar" className="mx-auto max-w-[1400px] px-4 py-16 md:px-8 lg:py-24">
      <div className="grid gap-4 lg:grid-cols-12">
        <div className="lg:col-span-7">

            ))}
          </div>
        </div>

        <div className="flex flex-col border border-[color:var(--line)] p-6 sm:p-9 lg:col-span-5">
          <p className="label flex items-center gap-2"><span className="h-2 w-2 rounded-full bg-[#2F8F5B]" />En stock · sale en 24–48 h</p>
          <h2 className="display mt-5 text-3xl sm:text-4xl">X9 Cámara retro sin pantalla</h2>
          <p className="mt-5 flex items-baseline gap-3"><span className="display text-4xl font-bold">{money(total)}</span><s className="text-ink/50">{money(qty === 2 ? CONFIG.oldPrice * 2 : CONFIG.oldPrice)}</s></p>
          <p className="mt-1 text-sm text-ink/60">IVA incluido. Cámara, manual y cable USB-C en la caja.</p>

          <fieldset className="mt-8">
            <legend className="label mb-3">Acabado — {c.name}</legend>
            <div className="flex gap-3">

                <button key={k} onClick={() => { setColor(k); setView('front'); }} aria-pressed={color === k} aria-label={v.name}

              ))}
            </div>
          </fieldset>

          <fieldset className="mt-7">
            <legend className="label mb-3">Cantidad</legend>
            <div className="grid grid-cols-2 gap-3">
              {[[1, '1 cámara'], [2, '2 cámaras · −10 %']].map(([q, t]) => (
                <button key={q} onClick={() => setQty(q)} aria-pressed={qty === q}
                  className={`border px-4 py-3.5 text-left text-sm font-medium transition ${qty === q ? 'border-ink bg-ink text-bone' : 'border-[color:var(--line)] hover:border-ink'}`}>{t}</button>
              ))}
            </div>
          </fieldset>

          <Button onClick={buy} className="mt-8 w-full !min-h-[60px] !text-base">Comprar ahora · {money(total)}</Button>
          {note && <p role="status" className="mt-4 bg-sun/40 p-3 text-sm font-medium">{note}</p>}

            <li>30 días para devolverla</li><li>12 meses de garantía</li><li>Pago seguro</li>
          </ul>
          <p className="mt-auto pt-5 text-xs text-ink/50">Precios y condiciones de ejemplo; ajústalos a tu política real.</p>
        </div>
      </div>
    </section>
  );
}

        <Photo src={IMG.toast} alt="Brindis con copas de vino, foto analógica" className="aspect-[3/4] md:col-span-3" caption="Brindis" />
        <Photo src={IMG.powder} alt="Polvos de colores en un festival, foto analógica" className="aspect-square md:col-span-3" caption="Holi" />
      </div>
      <div className="mt-10 grid gap-8 md:grid-cols-12">
        <p className="text-lg leading-relaxed text-ink/80 md:col-span-5 md:col-start-1">Sacas el móvil, encuadras, repites, miras si has salido bien… y el momento ya pasó. La X9 quita la pantalla del medio.</p>

    ['Tarjeta a prueba de peques', 'La Micro SD solo sale con un destornillador. Se acabaron los sustos en el campamento.'],

function StickyBar() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const buy = document.getElementById('comprar'); let past = false, onBuy = false;
    const upd = () => setShow(past && !onBuy);
    const sc = () => { past = window.scrollY > 700; upd(); };
    const io = new IntersectionObserver(([e]) => { onBuy = e.isIntersecting; upd(); }, { threshold: 0.1 });
    if (buy) io.observe(buy);
    window.addEventListener('scroll', sc, { passive: true }); sc();
    return () => { window.removeEventListener('scroll', sc); io.disconnect(); };
  }, []);
  return (
    <div aria-hidden={!show} className="fixed inset-x-3 z-50 flex items-center justify-between bg-ink p-2 pl-5 text-bone shadow-2xl transition-transform duration-300 md:hidden"
      style={{ bottom: 'calc(12px + env(safe-area-inset-bottom, 0px))', transform: show ? 'none' : 'translateY(170%)' }}>
      <span className="display text-xl font-bold">X9 · {money(CONFIG.price)}</span>
      <a href="#comprar" className="btn bg-clay px-5 py-3 text-sm font-semibold text-ink">Comprar</a>
    </div>
  );
}

  );
}
