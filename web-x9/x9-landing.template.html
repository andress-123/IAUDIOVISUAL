/* ============ Hooks y utilidades de animación ============ */
function useJs() { useEffect(() => { document.documentElement.classList.add('js'); }, []); }

function Reveal({ children, delay = 0, className = '', as: Tag = 'div' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (!('IntersectionObserver' in window)) { el.classList.add('in'); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add('in'); io.disconnect(); } }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    io.observe(el); return () => io.disconnect();
  }, []);
  return <Tag ref={ref} className={`rv ${className}`} style={{ '--d': delay + 'ms' }}>{children}</Tag>;
}

function useCount(target, ms = 550) {
  const [v, setV] = useState(target); const from = useRef(target);
  useEffect(() => {
    const a = from.current, b = target; if (a === b) return;
    const t0 = performance.now(); let raf;
    const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); setV(a + (b - a) * e); if (p < 1) raf = requestAnimationFrame(step); else from.current = b; };
    raf = requestAnimationFrame(step); return () => { cancelAnimationFrame(raf); from.current = b; };
  }, [target]);
  return v;
}

function ScrollBar() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const f = () => { const h = document.documentElement.scrollHeight - innerHeight; setP(h > 0 ? scrollY / h : 0); };
    addEventListener('scroll', f, { passive: true }); f(); return () => removeEventListener('scroll', f);
  }, []);
  return <div aria-hidden="true" className="fixed inset-x-0 top-0 z-[60] h-[3px] origin-left bg-clay" style={{ transform: `scaleX(${p})` }} />;
}

/* ============ Captación de email ============ */
function EmailPopup() {
  const [open, setOpen] = useState(false); const [done, setDone] = useState(false); const [email, setEmail] = useState('');
  const P = CONFIG.popup;
  useEffect(() => {
    if (!P.enabled) return;
    try { if (sessionStorage.getItem('x9-popup')) return; } catch (e) {}
    let timer = false, scrolled = false, fired = false;
    const go = () => { if (!fired && timer && scrolled) { fired = true; setOpen(true); } };
    const t = setTimeout(() => { timer = true; go(); }, P.delaySec * 1000);
    const sc = () => { if (scrollY > innerHeight * 0.5) { scrolled = true; go(); } };
    addEventListener('scroll', sc, { passive: true });
    return () => { clearTimeout(t); removeEventListener('scroll', sc); };
  }, []);
  const close = () => { setOpen(false); try { sessionStorage.setItem('x9-popup', '1'); } catch (e) {} };
  useEffect(() => { if (!open) return; const k = e => e.key === 'Escape' && close(); addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, [open]);
  if (!open) return null;
  const submit = e => { e.preventDefault(); if (P.endpoint) { try { fetch(P.endpoint, { method: 'POST', body: JSON.stringify({ email }) }); } catch (x) {} } setDone(true); };
  return (
    <div className="fixed inset-0 z-[70] grid place-items-center bg-ink/60 p-5 backdrop-blur-sm fade" role="dialog" aria-modal="true" aria-labelledby="pp-t" onClick={close}>
      <div className="pop relative w-full max-w-md bg-bone p-8 sm:p-10" onClick={e => e.stopPropagation()}>
        <button onClick={close} aria-label="Cerrar" className="absolute right-4 top-4 grid h-10 w-10 place-items-center text-2xl transition hover:rotate-90 hover:text-clay">×</button>
        {!done ? (
          <form onSubmit={submit}>
            <p className="label text-clay">Antes de irte</p>
            <h2 id="pp-t" className="display mt-4 text-3xl">{P.discount} en tu primera cámara</h2>
            <p className="mt-4 text-ink/70">Apúntate y te damos el código al momento. Nada de spam, solo novedades de verdad.</p>
            <label htmlFor="pp-email" className="sr-only">Correo electrónico</label>
            <input id="pp-email" type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="tu@correo.com" className="mt-6 w-full border border-ink/30 bg-white px-4 py-4 outline-none transition focus:border-ink" />
            <button className="btn shine mt-3 flex min-h-[56px] w-full items-center justify-center bg-clay font-semibold text-onclay hover:bg-ink hover:text-bone">Quiero mi código</button>
            <button type="button" onClick={close} className="mt-4 w-full text-center text-sm text-ink/50 link-u">No, gracias</button>
          </form>
        ) : (
          <div className="fade text-center">
            <p className="label text-[#2F8F5B]">✓ Listo</p>
            <h2 className="display mt-4 text-3xl">Tu código</h2>
            <p className="display mt-6 border-2 border-dashed border-ink px-4 py-5 text-3xl tracking-wider">{P.code}</p>
            <p className="mt-4 text-sm text-ink/60">Úsalo al comprar para tener {P.discount} de descuento.{!P.endpoint && ' (Demo: conecta tu proveedor de email en CONFIG.popup.endpoint para guardar los correos.)'}</p>
            <button onClick={close} className="btn mt-6 flex min-h-[52px] w-full items-center justify-center bg-ink font-semibold text-bone hover:bg-clay hover:text-onclay">Seguir mirando</button>
          </div>
        )}
      </div>
    </div>
  );
}

      <div className="mx-auto flex max-w-[1240px] flex-col items-start justify-between gap-12 px-5 py-28 md:flex-row md:items-center md:px-10 lg:py-40">
        <Reveal><h2 className="display max-w-2xl text-4xl sm:text-6xl">El feeling de lo analógico, <span className="text-clay">sin gastar en revelar.</span></h2></Reveal>

        </Reveal>

        <div className="mx-auto flex max-w-[1240px] flex-wrap items-center justify-between gap-6 px-5 py-10 text-sm text-bone/60 md:px-10">
          <p>© {new Date().getFullYear()} Bravo · Fotografías de Unsplash con tratamiento analógico</p>
          <nav className="flex gap-8" aria-label="Legal"><a href="#top" className="link-u">Envíos</a><a href="#top" className="link-u">Devoluciones</a><a href="#top" className="link-u">Privacidad</a><a href="#top" className="link-u">Términos</a></nav>
        </div>
      </div>

}

function StickyBar() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const el = document.getElementById('comprar'); if (!el) return;
    let past = false, onBuy = false; const upd = () => setShow(past && !onBuy);
    const sc = () => { past = scrollY > innerHeight * 0.6; upd(); };
    const io = new IntersectionObserver(([e]) => { onBuy = e.isIntersecting; upd(); }, { threshold: 0.05 });
    io.observe(el); addEventListener('scroll', sc, { passive: true }); sc();
    return () => { io.disconnect(); removeEventListener('scroll', sc); };
  }, []);
  return (
    <div aria-hidden={!show} className="fixed inset-x-3 z-50 flex items-center justify-between bg-ink p-2 pl-5 text-bone shadow-2xl transition-transform duration-500 md:hidden"
      style={{ bottom: 'calc(12px + env(safe-area-inset-bottom, 0px))', transform: show ? 'none' : 'translateY(170%)', transitionTimingFunction: 'cubic-bezier(.2,.7,.2,1)' }}>
      <span className="display text-lg">Bravo X9 · {money(CONFIG.price)}</span>
      <a href="#comprar" className="btn bg-clay px-5 py-3 text-sm font-semibold text-onclay">Comprar</a>
    </div>
  );
}

function App() {
  useJs();
  const [note, setNote] = useState('');
  const [ci, setCi] = useState(1);   // modelo elegido: marca el color de acento de toda la web
  useEffect(() => {
    const c = COLORS[ci], r = document.documentElement.style;
    r.setProperty('--accent-rgb', c.acc); r.setProperty('--on-rgb', c.on);
  }, [ci]);
  return (
    <div className="overflow-x-clip">
      <ScrollBar /><Header /><main><Hero ci={ci} /><Statement /><Buy note={note} onNote={setNote} ci={ci} setCi={setCi} /><Press /><Sin /><Features /><Compare /><Reviews /><SpecsFaq /><Final /></main><StickyBar /><EmailPopup />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
