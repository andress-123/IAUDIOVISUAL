<!doctype html><meta charset="utf-8"><title>Pruebas de identidad</title>
<style>body{margin:0;background:#fff;font:14px system-ui}canvas{display:block}</style>
<canvas id="c" width="1600" height="1000"></canvas>
<script src="engine.js"></script>
<script>const load=(u)=>new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=u;});
window.draw=async(spec)=>{const c=document.getElementById('c');
if(spec.foto)spec.image=await load(spec.foto);
// con foto, el lienzo adopta su proporción (alto 1400); sin foto, 1600x1000
if(spec.image&&!spec.w){c.height=spec.alto||1400;c.width=Math.round(c.height*spec.image.width/spec.image.height);}else{c.width=spec.w||1600;c.height=spec.h||1000;}
return Identidad.render(c,spec);};
window.png=()=>document.getElementById('c').toDataURL('image/png');</script>
